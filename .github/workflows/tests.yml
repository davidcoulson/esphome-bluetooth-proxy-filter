name: tests

on:
  push:
  pull_request:

jobs:
  parity-and-filter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidcoulson/esphome-ble-advert-filter
          # Frozen: this fork matches esphome-ble-advert-filter v1.7.0, the
          # last release before that repo moved on (v2.0.0 adds an RPA cache,
          # sensor/number platforms and actions that exist only there).
          ref: v1.7.0
          path: hook
      - run: HOOK_REPO=hook tests/run.sh

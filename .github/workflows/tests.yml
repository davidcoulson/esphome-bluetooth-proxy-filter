name: tests

on:
  push:
  pull_request:

jobs:
  parity-and-filter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: davidcoulson/esphome-ble-advert-filter
          # This fork's filter matches esphome-ble-advert-filter v2.0.2. Its
          # sensor/number platforms and actions exist only there.
          ref: v2.0.2
          path: hook
      - run: HOOK_REPO=hook tests/run.sh
